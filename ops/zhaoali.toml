# Non-secret deployment reference. The authoritative SSH inventory lives in
# /Users/zephyrsui/Developer/server-ops/inventory/servers/zhaoali.toml.
schema_version = 1
server_id = "zhaoali"
environment = "production"

[application]
id = "when2entretien"
base_path = "/when2entretien"
public_host = "h5.cnniceshop.com"
public_origin = "https://h5.cnniceshop.com/when2entretien"
remote_root = "/opt/when2entretien"
nginx_vhost = "/www/server/panel/vhost/nginx/h5.com.conf"

[services]
web = "when2entretien-web.service"
email_outbox_timer = "when2entretien-web-email-outbox.timer"

[release_gate]
requires_trusted_https = true
requires_http_redirect = true
requires_database_backup = true
requires_btree_gist = true
